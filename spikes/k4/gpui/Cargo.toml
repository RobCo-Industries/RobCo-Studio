[package]
name = "k4-gpui"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
image = { version = "=0.25.10", default-features = false }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
strip = true
