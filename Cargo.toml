[workspace]
resolver = "3"
members = [
    "crates/studio-sys",
    "crates/studio-disk",
    "crates/studio-core",
    "crates/robco",
    "crates/robco-studio",
]
# Each spike is its own small workspace with its own lock file, so a trial
# dependency never reaches the programs or their licence check.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Same release as rust-toolchain.toml. Both move together, in a pull request that does nothing else.
rust-version = "1.100.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/RobCo-Industries/RobCo-Studio"
publish = false

[workspace.dependencies]
studio-sys = { path = "crates/studio-sys" }
studio-disk = { path = "crates/studio-disk" }
studio-core = { path = "crates/studio-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
