name: release-build

# The one definition of how a release robco is built. ci.yml calls it on
# every push and pull request, and prerelease.yml calls it before it
# gathers a pre-release. Each system's job uploads an artifact
# robco-<name> that holds the program, robco-<name> or robco-<name>.exe,
# and its third-party notices, robco-<name>-NOTICES.txt.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Each row names the runner and the target together. The label pins
        # the system version, and the first step checks that the machine has
        # the architecture the target needs, because the binary runs there.
        include:
          # Linux: statically linked against musl, so it runs in any container.
          - os: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-musl
            name: linux-x64
            rustflags: ""
            exe: ""
          # macOS 15 runners are Apple silicon. The Intel ones are macos-15-intel.
          - os: macos-15
            machine: arm64
            target: aarch64-apple-darwin
            name: macos-arm64
            rustflags: ""
            exe: ""
          # Windows: the C runtime is linked statically.
          - os: windows-2025
            machine: x86_64
            target: x86_64-pc-windows-msvc
            name: windows-x64
            rustflags: -C target-feature=+crt-static
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ matrix.exe }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
      RUNNER_LABEL: ${{ matrix.os }}
      BIN: target/${{ matrix.target }}/release/robco${{ matrix.exe }}
      RUSTFLAGS: -D warnings ${{ matrix.rustflags }}
    steps:
      - name: The runner can run the target
        env:
          EXPECTED: ${{ matrix.machine }}
        run: |
          got=$(uname -m)
          echo "runner machine: $got, expected: $EXPECTED for $TARGET"
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::runner $RUNNER_LABEL is $got, but $TARGET needs $EXPECTED"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Release build
        run: cargo build --release --locked -p robco --target "$TARGET"
      # The version line names the RobCo-Core commit of the submodule, which
      # the build script reads without git. "unknown" fails here.
      - name: Run the binary
        run: |
          out=$("./$BIN" --version | tr -d '\r')
          echo "$out"
          core=$(git -C external/robco-core rev-parse HEAD)
          want="^robco [0-9]+\.[0-9]+\.[0-9]+ robco-core $core\$"
          if ! printf '%s\n' "$out" | grep -qE "$want"; then
            echo "::error::unexpected version line: $out, expected robco-core $core"
            exit 1
          fi
      # robco does not call the C yet, so the linker leaves it out. The tests
      # of studio-sys call it: build them for the release target, check them
      # like robco, and run them.
      - name: Build the studio-sys tests for the release target
        run: |
          cargo test --release --locked -p studio-sys --target "$TARGET" \
            --no-run --message-format=json > "$RUNNER_TEMP/sys-tests.json"
          jq -r 'select(.profile.test == true and .executable != null) | .executable' \
            "$RUNNER_TEMP/sys-tests.json" | tr -d '\r' > "$RUNNER_TEMP/sys-tests.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            while read -r f; do cygpath -u "$f"; done < "$RUNNER_TEMP/sys-tests.txt" > "$RUNNER_TEMP/x" \
              && mv "$RUNNER_TEMP/x" "$RUNNER_TEMP/sys-tests.txt"
          fi
          cat "$RUNNER_TEMP/sys-tests.txt"
          [ -s "$RUNNER_TEMP/sys-tests.txt" ] || { echo "::error::no studio-sys test binary"; exit 1; }
      - name: The binaries are static
        if: runner.os == 'Linux'
        run: |
          bad=0
          while read -r f; do
            file "$f"
            if out=$(ldd "$f" 2>&1); then rc=0; else rc=$?; fi
            echo "ldd $f: $out (exit $rc)"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "::error::$f is linked dynamically"; bad=1 ;;
            esac
          done < <(echo "$BIN"; cat "$RUNNER_TEMP/sys-tests.txt")
          exit $bad
      - name: The binaries link the C runtime statically
        if: runner.os == 'Windows'
        run: |
          bad=0
          while read -r f; do
            if grep -a -i -o -E '(vcruntime|msvcp)[0-9]+[_a-z0-9]*\.dll|api-ms-win-crt-[a-z0-9-]+\.dll|ucrtbase\.dll|clang_rt[a-z0-9_.-]*\.dll|libunwind\.dll|libc\+\+\.dll' "$f" > crt-imports.txt; then
              sort -u crt-imports.txt
              echo "::error::$f imports a C runtime from a DLL"
              bad=1
            else
              echo "$f: no C runtime DLL among the imports"
            fi
          done < <(echo "$BIN"; cat "$RUNNER_TEMP/sys-tests.txt")
          exit $bad
      - name: Run the studio-sys tests on the release target
        run: cargo test --release --locked -p studio-sys --target "$TARGET"
      # The crates of the locked tree that robco holds for this target,
      # each with its licence texts from cargo's own copy of its source,
      # and the C of RobCo-Core. No network.
      - name: Third-party notices
        run: |
          # Windows may have a python3 that only opens the Store.
          if python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          mkdir -p dist
          cp "$BIN" "dist/robco-$NAME$EXE"
          "$py" -I tools/release/notices.py --target "$TARGET" --out "dist/robco-$NAME-NOTICES.txt"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: robco-${{ matrix.name }}
          path: dist
          if-no-files-found: error
