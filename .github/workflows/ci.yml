name: ci

on:
  push:
    branches: [main, s1-sys]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licences, advisories, bans and sources
        run: cargo deny --locked check

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked -p robco
      - name: Run the binary
        run: |
          out=$(./target/release/robco$EXE --version | tr -d '\r')
          echo "$out"
          case "$out" in
            "robco "[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected version line: $out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: robco-${{ runner.os }}-${{ runner.arch }}
          path: target/release/robco${{ env.EXE }}
          if-no-files-found: error

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: RobCo-Core is pinned to a commit on its main branch
        run: |
          pin=$(git rev-parse HEAD:external/robco-core)
          head=$(git -C external/robco-core rev-parse HEAD)
          echo "RobCo-Core pinned at $pin"
          [ "$pin" = "$head" ] || { echo "::error::checked out $head, pinned $pin"; exit 1; }
          git -C external/robco-core fetch --quiet origin main
          git -C external/robco-core merge-base --is-ancestor "$pin" FETCH_HEAD \
            || { echo "::error::$pin is not on RobCo-Core main"; exit 1; }

  sys-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Write the card
        run: |
          mkdir -p "$RUNNER_TEMP/card"
          STUDIO_SYS_CARD_OUT="$RUNNER_TEMP/card/card.img" \
            cargo test -p studio-sys --locked --test card -- --exact card_written_from_rust
          test -s "$RUNNER_TEMP/card/card.img"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-sys-card
          path: ${{ runner.temp }}/card
          if-no-files-found: error

  sys-card-mtools:
    needs: sys-card
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/robco-industries/robco-ci:ba6372158e4b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-sys-card
          path: card
      - name: Read the card with mtools
        run: crates/studio-sys/scripts/check_card.sh card/card.img

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
