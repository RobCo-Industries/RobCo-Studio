name: ci

on:
  push:
    branches: [main, s1-qemu-guard]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licences, advisories, bans and sources
        run: cargo deny --locked check

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked -p robco
      - name: Run the binary
        run: |
          out=$(./target/release/robco$EXE --version | tr -d '\r')
          echo "$out"
          case "$out" in
            "robco "[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected version line: $out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: robco-${{ runner.os }}-${{ runner.arch }}
          path: target/release/robco${{ env.EXE }}
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
