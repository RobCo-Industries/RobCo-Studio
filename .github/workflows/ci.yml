name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Libraries the window toolkit builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Libraries the window toolkit builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev
      - name: Tests
        run: cargo test --workspace --locked

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licences, advisories, bans and sources
        run: cargo deny --locked check

  file-licences:
    runs-on: ubuntu-latest
    steps:
      # The submodule is checked out so that the check sees it and skips it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Every file carries an SPDX licence
        uses: fsfe/reuse-action@v5
        with:
          args: lint

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tests of the pin check
        run: python3 -m unittest scripts/test_check_pins.py
      - name: Toolchain file, manifests and the RobCo-Core submodule agree
        run: python3 scripts/check-pins.py
      - name: No workflow file repeats a key
        run: python3 scripts/check-workflows.py

  release:
    strategy:
      fail-fast: false
      matrix:
        # Each row names the runner and the target together. The label pins
        # the system version, and the first step checks that the machine has
        # the architecture the target needs, because the binary runs there.
        include:
          # Linux: statically linked against musl, so it runs in any container.
          - os: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-musl
            rustflags: ""
            exe: ""
          # macOS 15 runners are Apple silicon. The Intel ones are macos-15-intel.
          - os: macos-15
            machine: arm64
            target: aarch64-apple-darwin
            rustflags: ""
            exe: ""
          # Windows: the C runtime is linked statically.
          - os: windows-2025
            machine: x86_64
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      EXE: ${{ matrix.exe }}
      BIN: target/${{ matrix.target }}/release/robco${{ matrix.exe }}
      RUSTFLAGS: -D warnings ${{ matrix.rustflags }}
    steps:
      - name: The runner can run the target
        env:
          EXPECTED: ${{ matrix.machine }}
        run: |
          got=$(uname -m)
          echo "runner machine: $got, expected: $EXPECTED for ${{ matrix.target }}"
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::runner ${{ matrix.os }} is $got, but ${{ matrix.target }} needs $EXPECTED"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Release build
        run: cargo build --release --locked -p robco --target ${{ matrix.target }}
      - name: Run the binary
        run: |
          out=$("./$BIN" --version | tr -d '\r')
          echo "$out"
          case "$out" in
            "robco "[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected version line: $out"; exit 1 ;;
          esac
      # robco does not call the C yet, so the linker leaves it out. The tests
      # of studio-sys call it: build them for the release target, check them
      # like robco, and run them.
      - name: Build the studio-sys tests for the release target
        run: |
          cargo test --release --locked -p studio-sys --target ${{ matrix.target }} \
            --no-run --message-format=json > "$RUNNER_TEMP/sys-tests.json"
          jq -r 'select(.profile.test == true and .executable != null) | .executable' \
            "$RUNNER_TEMP/sys-tests.json" | tr -d '\r' > "$RUNNER_TEMP/sys-tests.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            while read -r f; do cygpath -u "$f"; done < "$RUNNER_TEMP/sys-tests.txt" > "$RUNNER_TEMP/x" \
              && mv "$RUNNER_TEMP/x" "$RUNNER_TEMP/sys-tests.txt"
          fi
          cat "$RUNNER_TEMP/sys-tests.txt"
          [ -s "$RUNNER_TEMP/sys-tests.txt" ] || { echo "::error::no studio-sys test binary"; exit 1; }
      - name: The binaries are static
        if: runner.os == 'Linux'
        run: |
          bad=0
          while read -r f; do
            file "$f"
            if out=$(ldd "$f" 2>&1); then rc=0; else rc=$?; fi
            echo "ldd $f: $out (exit $rc)"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "::error::$f is linked dynamically"; bad=1 ;;
            esac
          done < <(echo "$BIN"; cat "$RUNNER_TEMP/sys-tests.txt")
          exit $bad
      - name: The binaries link the C runtime statically
        if: runner.os == 'Windows'
        run: |
          bad=0
          while read -r f; do
            if grep -a -i -o -E '(vcruntime|msvcp)[0-9]+[_a-z0-9]*\.dll|api-ms-win-crt-[a-z0-9-]+\.dll|ucrtbase\.dll|clang_rt[a-z0-9_.-]*\.dll|libunwind\.dll|libc\+\+\.dll' "$f" > crt-imports.txt; then
              sort -u crt-imports.txt
              echo "::error::$f imports a C runtime from a DLL"
              bad=1
            else
              echo "$f: no C runtime DLL among the imports"
            fi
          done < <(echo "$BIN"; cat "$RUNNER_TEMP/sys-tests.txt")
          exit $bad
      - name: Run the studio-sys tests on the release target
        run: cargo test --release --locked -p studio-sys --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: robco-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  sys-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Write the card
        run: |
          mkdir -p "$RUNNER_TEMP/card"
          STUDIO_SYS_CARD_OUT="$RUNNER_TEMP/card/card.img" \
            cargo test -p studio-sys --locked --test card -- --exact card_written_from_rust
          test -s "$RUNNER_TEMP/card/card.img"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-sys-card
          path: ${{ runner.temp }}/card
          if-no-files-found: error

  sys-card-mtools:
    needs: sys-card
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/robco-industries/robco-ci:ba6372158e4b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-sys-card
          path: card
      - name: Read the card with mtools
        run: crates/studio-sys/scripts/check_card.sh card/card.img

  # The pipos package that robco build installs in build-tape. It is not
  # published yet, so this job builds it from Pip-OS at a pinned commit,
  # with the pinned xPack compiler, in the suite's CI image, and keeps it
  # as an artifact.
  pipos-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/robco-industries/robco-ci:ba6372158e4b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PIPOS_COMMIT: 93a07d266be43feab3e96e186d40c8b536f54bae
      XPACK_RELEASE: 15.2.1-1.1
      XPACK_SHA256: da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RobCo-Industries/Pip-OS
          ref: ${{ env.PIPOS_COMMIT }}
          submodules: recursive
          persist-credentials: false
      # The container's user does not own the checkout, and the Makefile
      # asks git for the files that go into the package.
      - name: Let git read the checkout
        run: git config --global --add safe.directory '*'
      - name: xPack arm-none-eabi-gcc
        run: |
          name="xpack-arm-none-eabi-gcc-$XPACK_RELEASE"
          f="$name-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gcc"
          python3 -I -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$XPACK_RELEASE/$f" "$RUNNER_TEMP/gcc/$f"
          echo "$XPACK_SHA256  $RUNNER_TEMP/gcc/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP/gcc" -xzf "$RUNNER_TEMP/gcc/$f"
          echo "CROSS=$RUNNER_TEMP/gcc/$name/bin/arm-none-eabi-" >> "$GITHUB_ENV"
      # make sdk-package runs the package checker on the zip it writes.
      - name: Build and check the package
        run: |
          make sdk-package CROSS="$CROSS" SDK_GCC_RELEASE="$XPACK_RELEASE" PYTHON=python3
          python3 tools/sdk_package.py check build/pipos-*.zip
          sha256sum build/pipos-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pipos-package
          path: build/pipos-*.zip
          if-no-files-found: error

  # robco build on the three systems: installs the package above and the
  # xPack compiler of the host from a fixture index of local files, then
  # builds a small project of one C file. The test writes the index; this
  # job only fetches the files. Each tape goes up for tape-hashes.
  build-tape:
    needs: pipos-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux-x64.tar.gz
            sha: da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6
          - os: macos-latest
            archive: darwin-arm64.tar.gz
            sha: 574082d35e49a2bcbdc355836b2a3ae5e5bb3b9456c9f5e37177db2ab4aad870
          - os: windows-latest
            archive: win32-x64.zip
            sha: bae6a3d1667697ce750c3b13d6d26d80973ecedc2cc87bf04869e83447fd93ea
    runs-on: ${{ matrix.os }}
    env:
      XPACK_RELEASE: 15.2.1-1.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pipos-package
          path: ${{ runner.temp }}/pipos
      - name: Fetch the xPack compiler and check its SHA-256
        run: |
          f="xpack-arm-none-eabi-gcc-$XPACK_RELEASE-${{ matrix.archive }}"
          mkdir -p "$RUNNER_TEMP/gcc"
          curl -fsSLo "$RUNNER_TEMP/gcc/$f" "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$XPACK_RELEASE/$f"
          python -I -c "import hashlib,sys; h=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(); print(h); sys.exit(h!=sys.argv[2])" "$RUNNER_TEMP/gcc/$f" "${{ matrix.sha }}"
          zip=$(ls "$RUNNER_TEMP"/pipos/pipos-*.zip)
          {
            echo "ROBCO_TEST_PIPOS=$zip"
            echo "ROBCO_TEST_GCC=$RUNNER_TEMP/gcc/$f"
            echo "ROBCO_TEST_GCC_ROOT=xpack-arm-none-eabi-gcc-$XPACK_RELEASE"
            echo "ROBCO_TEST_TAPE_OUT=$RUNNER_TEMP/tape/TINY.HTP"
            echo "ROBCO_TEST_REQUIRE_BUILD=1"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tape"
      - name: robco build
        run: cargo test --locked -p robco --test build
      - name: rimg.py verify passes
        if: runner.os == 'Linux'
        run: python -I external/robco-core/tools/rimg.py verify "$RUNNER_TEMP/tape/TINY.HTP"
      - uses: actions/upload-artifact@v4
        with:
          name: tape-${{ runner.os }}
          path: ${{ runner.temp }}/tape/TINY.HTP
          if-no-files-found: error

  # The tape must be byte-equal on the three systems.
  tape-hashes:
    needs: build-tape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tape-*
          path: tapes
      - name: One SHA-256 on the three systems
        run: |
          sha256sum tapes/*/TINY.HTP | tee sums.txt
          test "$(wc -l < sums.txt)" -eq 3
          test "$(cut -d' ' -f1 sums.txt | sort -u | wc -l)" -eq 1

  # Pip-OS's sdk/examples/tape built by Make and by robco build, in the
  # suite's container, with the xPack compiler the package names: the two
  # tapes must be equal, and one raw image sealed by rimg.py and by the C
  # sealer must be equal. tools/agreement.sh does the work and runs on a
  # laptop too. A second run with the container's own compiler must fail.
  agreement:
    needs: pipos-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/robco-industries/robco-ci:ba6372158e4b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PIPOS_COMMIT: 93a07d266be43feab3e96e186d40c8b536f54bae
      XPACK_RELEASE: 15.2.1-1.1
      XPACK_SHA256: da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6
      RUSTUP_VERSION: 1.28.2
      RUSTUP_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
      ABI: "1.4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: studio
      # The same commit the package was built from, so both builds read
      # one crt0.S and one set of headers.
      - uses: actions/checkout@v4
        with:
          repository: RobCo-Industries/Pip-OS
          ref: ${{ env.PIPOS_COMMIT }}
          submodules: recursive
          persist-credentials: false
          path: pipos
      - uses: actions/download-artifact@v4
        with:
          name: pipos-package
          path: ${{ runner.temp }}/pkg
      - name: xPack arm-none-eabi-gcc
        run: |
          name="xpack-arm-none-eabi-gcc-$XPACK_RELEASE"
          f="$name-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gcc"
          python3 -I -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$XPACK_RELEASE/$f" "$RUNNER_TEMP/gcc/$f"
          echo "$XPACK_SHA256  $RUNNER_TEMP/gcc/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP/gcc" -xzf "$RUNNER_TEMP/gcc/$f"
          {
            echo "CROSS=$RUNNER_TEMP/gcc/$name/bin/arm-none-eabi-"
            echo "AGREE_GCC_ARCHIVE=$RUNNER_TEMP/gcc/$f"
            echo "AGREE_GCC_ROOT=$name"
            echo "PIPOS_ZIP=$(ls "$RUNNER_TEMP"/pkg/pipos-*.zip)"
            echo "PIPOS_DIR=$GITHUB_WORKSPACE/pipos"
          } >> "$GITHUB_ENV"
      # The container has no Rust: rustup-init at a pinned release, checked
      # by its SHA-256, then the toolchain rust-toolchain.toml pins.
      - name: Rust
        working-directory: studio
        run: |
          mkdir -p "$RUNNER_TEMP/rustup"
          f="$RUNNER_TEMP/rustup/rustup-init"
          curl -fsSLo "$f" "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $f" | sha256sum -c -
          chmod +x "$f"
          "$f" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: Make and robco build agree
        working-directory: studio
        run: |
          AGREE_GCC_RELEASE="$XPACK_RELEASE" OUT="$RUNNER_TEMP/agreement/xpack" tools/agreement.sh
      # The container's own arm-none-eabi-gcc in place of xPack for the
      # Make build: the run must fail with a check, exit 2, and its two
      # tapes must differ.
      - name: The container's compiler fails the check
        working-directory: studio
        run: |
          out="$RUNNER_TEMP/agreement/container-gcc"
          rel="$(arm-none-eabi-gcc -dumpversion)-container"
          set +e
          CROSS=arm-none-eabi- AGREE_GCC_RELEASE="$rel" OUT="$out" tools/agreement.sh
          code=$?
          set -e
          test "$code" -eq 2
          test "$(sed -n 1p "$out/hashes.txt" | cut -d' ' -f1)" != "$(sed -n 2p "$out/hashes.txt" | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agreement-hashes
          path: ${{ runner.temp }}/agreement/*/hashes.txt
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
