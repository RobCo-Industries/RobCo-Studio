name: spike-k7

on:
  push:
    branches: [spike-k7]
  pull_request:
    paths:
      - "spikes/k7/**"
      - ".github/workflows/spike-k7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-k7-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  editor:
    name: "editor on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/k7
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install system packages for egui
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev
      - name: Count packages in the lock file
        run: echo "lock packages: $(grep -c '^name = ' Cargo.lock)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        run: cargo fmt --check
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Clean debug build
        run: |
          start=$(date +%s)
          cargo build --locked --all-targets
          echo "clean debug build: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Headless tests
        run: cargo test --locked
      - name: Clean release build
        run: |
          start=$(date +%s)
          cargo build --release --locked
          echo "clean release build: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release program size
        run: |
          bin=target/release/k7-editor
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          echo "release size: $(wc -c < "$bin") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cost of one edit, no window
        run: cargo test --release --locked --test cost -- --ignored --nocapture | tee -a "$GITHUB_STEP_SUMMARY"
