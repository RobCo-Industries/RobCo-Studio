<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="at-t" style="color:#5aff7f">
<!-- SPDX-FileCopyrightText: 2026 The RobCo Studio contributors -->
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Provenance: Traced from a reference picture supplied by the project owner. -->
  <title id="at-t">Atom mark</title>
  <!-- The atom mark of RobCo Studio: three orbits, a nucleus and four electrons. Ellipses and circles only.
       Traced from a reference picture supplied by the project owner. The picture's atom was measured, not outlined:
       its three orbits were fitted to the lit lines and then made regular. They share one centre and one pair of axes,
       one stands upright and the other two lean 28.4 degrees from the horizontal. The stroke, the nucleus and
       the electrons have the picture's sizes and places. One unit is 1.205 pixels of the picture.
       Groups: "halo" is the baked glow, a wider stroke under a blur. Drop it with effects off.
       Licence: same as the repository that ships it. Provenance: traced from a reference picture supplied by the project owner, 2026-11-25. -->
  <rect class="asset-ground" width="64" height="64" fill="#091d10"/>
  <defs>
    <filter id="at-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <g id="at-orbits" fill="none"><ellipse cx="32" cy="32" rx="26.2" ry="7.6" transform="rotate(90 32 32)"/><ellipse cx="32" cy="32" rx="26.2" ry="7.6" transform="rotate(28.4 32 32)"/><ellipse cx="32" cy="32" rx="26.2" ry="7.6" transform="rotate(-28.4 32 32)"/></g>
    <g id="at-dots" stroke="none"><circle cx="32" cy="32" r="3.8"/><circle cx="50.4" cy="46.1" r="2.2"/><circle cx="10.5" cy="24.9" r="1.3"/><circle cx="17.5" cy="18.3" r="1.5"/><circle cx="52.4" cy="18" r="1.3"/></g>
  </defs>
  <g class="halo" opacity=".5" filter="url(#at-blur)">
    <use href="#at-orbits" stroke="currentColor" stroke-width="3.5"/>
    <use href="#at-dots" fill="currentColor"/>
  </g>
  <g class="mark">
    <use href="#at-orbits" stroke="currentColor" stroke-width="1.7"/>
    <use href="#at-dots" fill="currentColor"/>
  </g>
</svg>
