<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 361 63" width="361" height="63" role="img" aria-labelledby="wm-t" style="color:#5aff7f">
<!-- SPDX-FileCopyrightText: 2026 The RobCo Studio contributors -->
