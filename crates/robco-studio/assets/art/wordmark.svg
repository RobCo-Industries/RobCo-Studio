  <title id="wm-t">RobCo Studio</title>
  <!-- The lettering of RobCo Studio, as filled outlines. No font is used.
       Traced from a reference picture supplied by the project owner. The outlines follow the picture's letters.
       Straight edges are lines, the stems lean 19.0 degrees, and round corners are cubic curves.
       The picture's registered-mark sign is left out.
       Groups: "halo" is the baked glow, the same outlines with a wider edge under a blur. "letters" is the word itself.
       Drop "halo" with effects off. The letters stand on y 54 and reach y 9. The file keeps 9 units of room around them for the glow.
       One unit is 1.168 pixels of the picture.
       Licence: same as the repository that ships it. Provenance: traced from a reference picture supplied by the project owner, 2026-11-25. -->
