<!-- Provenance: original art, drawn for RobCo Studio on 2026-11-25. Nothing in it is traced, copied or redrawn from a game. -->
  <title id="cd-t">Memory card</title>
  <!-- Original drawing of a memory card. Front view, strokes only. Studio writes the disk name and the size on
       the label with its own bitmap font, so this file holds no text.
       States the app draws on top: a tick for verified, a slashed circle for refused, a fill bar while writing.
       The drawing fills the box 0 0 120 160. The file keeps 8 units around that box for the glow.
       Groups: "halo" is the baked glow, the outline under a blur. Drop it with effects off.
       Licence: same as the repository that ships it. Provenance: drawn for Studio, 2026-11-25. -->
  <rect class="asset-ground" x="-8" y="-8" width="136" height="176" fill="#091d10"/>
  <defs><filter id="cd-blur" x="-15%" y="-10%" width="130%" height="120%"><feGaussianBlur stdDeviation="3.5"/></filter></defs>
  <g class="halo" fill="none" stroke="currentColor" opacity=".5" filter="url(#cd-blur)"><path d="M14 8H82L106 32V66L98 74V152H14Z" stroke-width="5"/></g>
  <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 8H82L106 32V66L98 74V152H14Z" stroke-width="2" fill="currentColor" fill-opacity=".1"/>
    <path d="M19 13H80L101 34V64L93 72V147H19Z" stroke-width="1" opacity=".28"/>
    <g stroke="none" fill="currentColor" opacity=".55">
      <rect x="24" y="20" width="6" height="22"/><rect x="34" y="20" width="6" height="22"/><rect x="44" y="20" width="6" height="22"/>
      <rect x="54" y="20" width="6" height="22"/><rect x="64" y="20" width="6" height="22"/><rect x="74" y="24" width="6" height="18"/>
    </g>
    <rect class="label" x="24" y="88" width="64" height="50" stroke-width="1.5"/>
    <path d="M24 78H60" stroke-width="1.5" opacity=".55"/>
  </g>
</svg>
