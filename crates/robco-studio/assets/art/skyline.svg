  <g class="halo" stroke="currentColor" stroke-width="2.6" opacity=".5" filter="url(#sk-blur)"><use href="#sk-near"/></g>
  <g class="mid" fill="none" stroke="currentColor" stroke-width="1" opacity=".55">
    <path d="M0 59H420"/>
  </g>
  <g class="near" stroke="currentColor" stroke-width="1.2"><use href="#sk-near"/></g>
</svg>
