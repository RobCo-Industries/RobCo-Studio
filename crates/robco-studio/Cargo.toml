[package]
name = "robco-studio"
description = "The RobCo Studio window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
studio-core.workspace = true
# The window toolkit, at the version spikes K4 and K7 tried. MIT or Apache-2.0.
# No default fonts: Studio bundles its own. No links feature: Studio opens no URL.
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "wayland",
    "wgpu",
    "x11",
] }
# The system's folder chooser for File, Open folder. MIT.
# No defaults: on Linux only the portal backend, which loads libdbus at run
# time and falls back to zenity, so the build needs no GTK and no D-Bus headers.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Reads theme files and settings.toml, as studio-core reads robco.toml, and
# writes settings.toml back with the keys it does not know. The display
# feature adds toml_writer, already in the tree. MIT OR Apache-2.0.
toml = { version = "1.2.3", default-features = false, features = ["std", "parse", "display", "serde"] }
# Rasterises the wordmark and the icons at start-up. Apache-2.0 OR MIT.
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
# Headless tests through the accessibility tree, and the PNG renders. MIT or Apache-2.0.
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
# Writes the PNG renders. MIT OR Apache-2.0.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Parses and validates the screen pass's WGSL with no GPU. The version wgpu
# uses, already in eframe's tree. MIT OR Apache-2.0.
naga = { version = "30.0.2", features = ["wgsl-in"] }

[lints]
workspace = true

# O_NONBLOCK, so opening a named pipe does not wait for a writer. MIT OR Apache-2.0.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The native menu bar on macOS. Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
# Reads the system's Reduce motion switch. Already in the tree through muda
# and winit; these features add no crate. Zlib OR Apache-2.0 OR MIT.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSWorkspace",
] }
