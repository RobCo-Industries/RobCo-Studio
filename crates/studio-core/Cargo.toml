[package]
name = "studio-core"
description = "The headless core of RobCo Studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
studio-sys.workspace = true
studio-disk.workspace = true
serde_json = "1"
# Reads robco.toml. It reports error spans and refuses duplicate keys.
toml = { version = "1.2.3", default-features = false, features = ["std", "parse", "serde"] }

# Wraps the Job Object calls, which need `unsafe`, forbidden in this crate.
[target.'cfg(windows)'.dependencies]
win32job = "2.1.0"

[lints]
workspace = true
