[package]
name = "robco"
description = "The robco command of RobCo Studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
studio-core.workspace = true
studio-net.workspace = true
# Quotes the strings of JSON lines. Already in the lock through studio-core. MIT or Apache-2.0.
serde_json = "1"

[dev-dependencies]
# Its test server, and a transport that trusts the test's certificate.
studio-net = { workspace = true, features = ["test-trust"] }
# Makes the small package and tool archives of the tests. Already in the lock through studio-core. MIT.
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
